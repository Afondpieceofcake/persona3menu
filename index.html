<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="main-menu">
      <div class="item-holder">
        <p class="menu-item" data-text="SKILL">SKILL</p>
        <p class="menu-item" data-text="ITEM">ITEM</p>
        <p class="menu-item" data-text="EQUIP">EQUIP</p>
      </div>
    </div>

    <div class="main-menu_overlay">
      <div class="item-holder">
        <p class="menu-item" data-text="SKILL">SKILL</p>
        <p class="menu-item" data-text="ITEM">ITEM</p>
        <p class="menu-item" data-text="EQUIP">EQUIP</p>
      </div>
    </div>

    <div class="decor">
      <div id="left-white">
        <p id="left-text" style="white-space: nowrap"><span>01</span>MAIN</p>
        <div class="cash-box">
          <p style="font-family: cashtext; margin: 0"><span>¥</span>52,163</p>
          <p>current wallet</p>
        </div>
      </div>
    </div>

    <div class="head-holder">
      <p class="head">
        <img class="head-image" src="./images/placeholder_image.png" />
      </p>
      <p class="head">
        <img class="head-image" src="./images/placeholder_image.png" />
      </p>
      <p class="head">
        <img class="head-image" src="./images/placeholder_image.png" />
      </p>
    </div>

    <div id="skill-usage">
      <p>Use a Skill</p>
      <p>Command ━━━━━━━━━━━━━</p>

      <div id="skill-usage_button">
        <img src="./images/placeholder_image.png" />
        <p>Confirm</p>
        <img src="./images/placeholder_image.png" />
        <p>Close</p>
      </div>
    </div>

    <video autoplay muted loop playsinline id="video_background">
      <source
        src="./videos/Persona 3 Reload - Live Wallpaper.mp4"
        type="video/mp4"
      />
    </video>

    <script src="scripts.js"></script>
  </body>
</html>
